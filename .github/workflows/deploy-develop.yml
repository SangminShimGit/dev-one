# Deploy Shopify theme when pushing to develop.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   SHOPIFY_FLAG_STORE          — Store URL (e.g. your-store.myshopify.com)
#   SHOPIFY_CLI_THEME_TOKEN     — Theme Access password from:
#                                 https://apps.shopify.com/theme-access
#
# Each successful run creates theme "test-one-{date}-{run_number}", pushes files,
# and publishes it as the live theme.

name: Deploy develop theme

on:
  push:
    branches:
      - develop

env:
  SHOPIFY_FLAG_STORE: ${{ secrets.SHOPIFY_FLAG_STORE }}
  SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
  SHOPIFY_FLAG_FORCE: "1"
  SHOPIFY_CLI_TTY: "0"

jobs:
  theme-check:
    name: Theme Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Run Theme Check
        run: shopify theme check --fail-level error
        env:
          SHOPIFY_FLAG_FAIL_LEVEL: error

  deploy:
    name: Deploy
    needs: theme-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Shopify CLI
        run: npm install -g @shopify/cli @shopify/theme

      - name: Push and publish theme
        run: |
          THEME_NAME="test-one-$(date +%Y-%m-%d)-${{ github.run_number }}"
          shopify theme push \
            --unpublished \
            --theme "${THEME_NAME}" \
            --publish \
            --json
